components:
  crudResources:
    timeEntry:
      collections:
        timeEntries:
          urlTemplate: /v1/workspaces/{workspaceId}/user/{userId}/time-entries
      description: A time entry on a Clockify workspace.
      identity:
        bindings:
          id:
            field: id
          workspaceId:
            field: workspaceId
        urlTemplate: /v1/workspaces/{workspaceId}/time-entries/{id}
      schema:
        $ref: '#/components/schemas/TimeEntry'
  paginationSchemes:
    pageNumber:
      description: 'Clockify''s list endpoints use 1-indexed page/page-size query parameters and return a plain JSON array with no pagination metadata in the body. Clockify also reports completion via a custom Last-Page response header, but paging stops the same way as other pageNumber platforms in this catalog: a page shorter than the requested page-size is the last one.'
      request:
        queryParameters:
          page:
            role: page
          page-size:
            role: pageSize
      type: pageNumber
  parameters:
    End:
      description: Represents an end date in the yyyy-MM-ddThh:mm:ssZ format.
      in: query
      name: end
      required: false
      schema:
        format: date-time
        type: string
    Page:
      description: Page number.
      in: query
      name: page
      required: false
      schema:
        default: 1
        minimum: 1
        type: integer
    PageSize:
      description: Page size.
      in: query
      name: page-size
      required: false
      schema:
        default: 50
        minimum: 1
        type: integer
    Start:
      description: Represents a start date in the yyyy-MM-ddThh:mm:ssZ format.
      in: query
      name: start
      required: false
      schema:
        format: date-time
        type: string
    UserId:
      description: Represents a user identifier across the system.
      in: path
      name: userId
      required: true
      schema:
        type: string
    WorkspaceId:
      description: Represents a workspace identifier across the system.
      in: path
      name: workspaceId
      required: true
      schema:
        type: string
  schemas:
    TimeEntry:
      properties:
        billable:
          type: boolean
        description:
          nullable: true
          type: string
        id:
          type: string
        isLocked:
          type: boolean
        kioskId:
          nullable: true
          type: string
        projectId:
          nullable: true
          type: string
        tagIds:
          items:
            type: string
          nullable: true
          type: array
        taskId:
          nullable: true
          type: string
        timeInterval:
          $ref: '#/components/schemas/TimeInterval'
        type:
          enum:
          - REGULAR
          - BREAK
          type: string
        userId:
          type: string
        workspaceId:
          type: string
      required:
      - id
      - workspaceId
      - userId
      type: object
    TimeInterval:
      nullable: true
      properties:
        duration:
          nullable: true
          type: string
        end:
          format: date-time
          nullable: true
          type: string
        start:
          format: date-time
          nullable: true
          type: string
      type: object
  securitySchemes:
    clockifyApiKey:
      description: A personal API key generated in Clockify's Profile Settings. Clockify has no OAuth2 login; this is the only supported authentication mode.
      in: header
      name: X-Api-Key
      type: apiKey
info:
  contact:
    name: Clockify Developer Connection
    url: https://docs.clockify.me/
  description: Compatible read-only subset of Clockify's public REST API for synchronizing a user's time entries on one workspace. Clockify has no OAuth2 login; every request authenticates with a personal API key sent as the X-Api-Key header (declared by this platform's auth-overlay). workspaceId and userId are supplied as constants, the same way other catalog platforms without an auto-discovery step (e.g. GitHub Issues' owner/repo) require them. This document preserves only the list and single-item read operations needed by Local Thought, scoped to Clockify's global API origin; regional/private subdomain origins are not covered.
  title: Clockify API (read-only time entries subset)
  version: 1.0.0-readonly
  x-apisguru-categories:
  - productivity
  x-origin:
  - format: openapi
    url: https://docs.clockify.me/
    version: '3.0'
  x-providerName: clockify.me
  x-serviceName: api-readonly
openapi: 3.0.3
paths:
  /v1/workspaces/{workspaceId}/time-entries/{id}:
    get:
      operationId: get-time-entry
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - description: Represents a time entry identifier across the system.
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeEntry'
          description: A single time entry.
        '401':
          description: The API key is missing or invalid.
        '403':
          description: The request is not allowed.
        '404':
          description: The time entry does not exist.
      security:
      - clockifyApiKey: []
      summary: Get a specific time entry on a workspace
      x-crud:
        action: read
        resource: timeEntry
  /v1/workspaces/{workspaceId}/user/{userId}/time-entries:
    get:
      operationId: get-time-entries-for-user
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/UserId'
      - $ref: '#/components/parameters/Start'
      - $ref: '#/components/parameters/End'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/TimeEntry'
                type: array
          description: A page of the user's time entries on this workspace.
        '401':
          description: The API key is missing or invalid.
        '403':
          description: The request is not allowed.
      security:
      - clockifyApiKey: []
      summary: Get time entries for a user on a workspace
      x-crud:
        action: list
        collection: timeEntries
        resource: timeEntry
      x-pagination:
      - scheme: pageNumber
security:
- clockifyApiKey: []
servers:
- url: https://api.clockify.me/api

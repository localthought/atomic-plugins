name: Identity overlays
on:
  pull_request:
    paths: ['catalog.json', 'googleapis.com/google-calendar/v3/**', 'github.com/github-issues/1.1.4/**', 'tests/**', 'requirements-identity-tests.txt', '.github/workflows/identity-overlays.yml']
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r requirements-identity-tests.txt
      - run: python tests/generate_identity_catalog_fixtures.py --output /tmp/identity-catalog
      - run: python tests/test_identity_overlays.py

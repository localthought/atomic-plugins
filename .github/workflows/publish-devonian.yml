name: Devonian publish to npm

# Publishes devonian/ to npm automatically whenever devonian/package.json's
# version on `main` is one npm doesn't have yet — so a normal "bump the
# version in the PR, merge it" is the whole release process; nobody needs
# to run `npm publish` by hand.
#
# This is a straight path translation of localthought/devonian's own
# publish.yml from when devonian lived in its own repo: same trigger logic,
# same version-check gate, same `prepublishOnly` build guarantee, just
# scoped under devonian/ now that it lives in this monorepo alongside
# integrations/.
#
# Auth is npm Trusted Publishing (OIDC) — configured on npmjs.com under the
# `devonian` package's Settings -> Trusted Publisher. That configuration
# has to be re-pointed at this repo (ontola/atomic-plugins) and this exact
# workflow filename (publish-devonian.yml) before this can publish; no
# NPM_TOKEN secret is used, `id-token: write` below is what lets this job
# mint a short-lived, run-scoped publish credential instead.

on:
  push:
    branches: [main]
    paths:
      - devonian/package.json
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: devonian
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: devonian/pnpm-lock.yaml
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run prettier:check
      - run: pnpm test
      # Trusted Publishing needs a recent npm CLI; Node 22's bundled npm
      # predates OIDC support, so this can't rely on whatever setup-node gave us.
      - run: npm install -g npm@latest
      - name: Check whether this version is already on npm
        id: version-check
        run: |
          local_version=$(node -p "require('./package.json').version")
          published_version=$(npm view devonian version 2>/dev/null || echo "none")
          echo "local version: $local_version; published version: $published_version"
          if [ "$local_version" = "$published_version" ]; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi
      # `npm publish` runs the package's own `prepublishOnly` (clean + build)
      # first, so the tarball always matches the source at this commit.
      - name: Publish
        if: steps.version-check.outputs.should_publish == 'true'
        run: npm publish

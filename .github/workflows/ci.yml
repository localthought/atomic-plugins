name: CI

# The packages under integrations/ import ontola/atomic-server's browser/lib
# by relative path (e.g. `../../browser/lib/src/index.js`), and their
# `*.live.test.ts` suites need a real running atomic-server. Neither exists
# in this repo, and atomic-server only publishes Docker images from its
# `develop` branch — not from feat/plugin-debug, which is what these
# integrations are being evolved alongside. So this workflow checks out
# atomic-server at the pinned commit in .atomic-server-ref and builds it from
# source, unmodified, to get a server to test against. Bump
# .atomic-server-ref to track feat/plugin-debug.
#
# atomic-server's own checkout is never mutated: this repo's integrations/
# is not copied into it before the build, so the binary embeds whatever
# integrations the pinned commit itself ships (build.rs::embed_integrations),
# not this repo's. Instead:
#   - `browser` is symlinked into this checkout (`atomic-plugins/browser` ->
#     the pinned atomic-server's `browser/`), the layout certify.mjs and
#     every package's relative `../../browser/lib/...` import already expect
#     (see certify.test.mjs's "CI browser and integration symlinks" case).
#   - `integrations/tooling/dev-server.mjs` stands in for the `/integrations`
#     route atomic-server would otherwise embed at build time: it serves
#     this repo's catalog.json and plugin.js bundles itself, and proxies
#     every other request through to the real atomic-server.
#   - `integrations/localthought/mock-proxy.mjs` (the same fixture
#     atomic-server's own dagger e2e pipeline runs) stands in for the real
#     LocalThought integration proxy, so the Integrations-page flow can run
#     without live provider credentials.
#
# ## Job graph
#
#   changes -> build-server -> { lane (matrix), hosting-surface, e2e-plugin-system }
#           -> shared-checks
#
# `build-server` exists because `cargo build --profile e2e` plus build.rs's
# embedded frontend is the entire cost of this pipeline; it runs once and
# every downstream job downloads the binary. The `lane` matrix then fans out
# one job per plugin, with `fail-fast: false` so a run reports every broken
# plugin rather than the first. Wall clock is `build-server + slowest lane`,
# not the sum of all of them.
#
# The lane list, its path filters and its port blocks live in
# `integrations/lanes.json` and are read through `integrations/tooling/lanes.mjs`
# — not restated here. Before that, the list was written out three times in
# this file (the `changes` job's `outputs:`, its `filters:`, and every step's
# `if:`), which is how `integrations/calendar/` shipped with no filter entry
# at all. `lanes.test.mjs` now fails if a plugin directory has no lane.
# See `integrations/PARALLEL_LANES.md` for the whole design.
#
# Each `lane` job runs `run-lane.mjs`, the same entry point a developer runs
# locally, so a failing lane's reproduction is one command with no env to
# reassemble.
#
# No Rust/WASM tests run here: not the sandboxTests declared in each
# package's atomicCertification (those are atomic-server's own `cargo test`
# suite, run by its CI), and not localthought's wasm-smoke.mjs /
# browser-smoke.mjs (they need a built wasm/pkg and a full Vite app
# respectively). Building the atomic-server binary itself is unavoidable
# infrastructure, not a test.

on:
  pull_request:
  # Required so the merge queue's temporary gh-readonly-queue/... commit gets
  # a CI run at all: GitHub gates required checks on the merge_group event,
  # not on the pull_request run from the PR head.
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10.15.1"

jobs:
  changes:
    name: Detect changed lanes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      any: ${{ steps.decide.outputs.any }}
      matrix: ${{ steps.decide.outputs.matrix }}
      has-lanes: ${{ steps.decide.outputs.has-lanes }}
    steps:
      - uses: actions/checkout@v4

      # Generated rather than written out, so adding a lane to lanes.json is
      # the only edit needed to gate it.
      - name: Generate path filters from lanes.json
        id: gen
        run: |
          {
            echo 'filters<<EOF'
            node integrations/tooling/lanes.mjs filters
            echo EOF
          } >> "$GITHUB_OUTPUT"

      # dorny/paths-filter reads changed files from the pull_request API, which
      # doesn't exist for a merge_group event, so it is skipped there and the
      # decide step below forces the full matrix instead: the queue always runs
      # everything rather than misdetecting an empty diff.
      - name: Path filters
        id: filter
        if: github.event_name != 'merge_group'
        uses: dorny/paths-filter@v3
        with:
          filters: ${{ steps.gen.outputs.filters }}

      - name: Decide the lane matrix
        id: decide
        env:
          # `changes` is dorny's JSON array of the filter names that matched.
          CHANGED: ${{ github.event_name == 'merge_group' && '["shared"]' || steps.filter.outputs.changes }}
          ANY: ${{ github.event_name == 'merge_group' && 'true' || steps.filter.outputs.any }}
        run: |
          set -eu
          matrix=$(node integrations/tooling/lanes.mjs matrix "$CHANGED")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "any=$ANY" >> "$GITHUB_OUTPUT"
          echo "has-lanes=$([ "$matrix" = '[]' ] && echo false || echo true)" >> "$GITHUB_OUTPUT"
          echo "changed: $CHANGED"
          echo "matrix:  $matrix"

  build-server:
    name: Build atomic-server (pinned)
    needs: changes
    if: needs.changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      sha: ${{ steps.pin.outputs.sha }}
    steps:
      - name: Checkout atomic-plugins
        uses: actions/checkout@v4
        with:
          path: atomic-plugins

      - name: Read pinned atomic-server commit
        id: pin
        run: echo "sha=$(cat atomic-plugins/.atomic-server-ref)" >> "$GITHUB_OUTPUT"

      - name: Checkout atomic-server at the pinned commit
        uses: actions/checkout@v4
        with:
          repository: ontola/atomic-server
          ref: ${{ steps.pin.outputs.sha }}
          path: atomic-server

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # wasm32-wasip2 builds the server-side plugin runtime component
          # (server/build.rs); without it atomic-server still builds but
          # plugins don't run, which the live and e2e tiers need.
          targets: wasm32-wasip2

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: atomic-server -> target
          prefix-key: atomic-server-${{ steps.pin.outputs.sha }}

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ steps.pin.outputs.sha }}-${{ hashFiles('atomic-server/browser/pnpm-lock.yaml') }}

      - name: Install JS dependencies
        working-directory: atomic-server/browser
        run: pnpm install --frozen-lockfile

      - name: Read the canonical e2e ports
        id: ports
        working-directory: atomic-plugins
        run: |
          node -e '
            const p = require("./integrations/lanes.json").canonicalPorts;
            for (const [k, v] of Object.entries(p))
              console.log(`${k}=${v}`);
          ' >> "$GITHUB_OUTPUT"

      # --no-default-features trims the default `https`, `telemetry` and
      # `img` features: nothing below uses TLS/ACME, OTel export
      # (tonic/opentelemetry-otlp pull in a heavy gRPC stack) or image
      # codecs, and the server falls back to plain server.bind() (serve.rs)
      # when `--https` isn't passed regardless of the `https` feature. Only
      # `wasm-plugins` (the sandbox the tests execute plugins in) stays.
      #
      # server/build.rs also builds the data-browser frontend to embed
      # (unconditionally, regardless of Cargo features), and that build's
      # `pnpm build:wasm` step downloads a pinned binaryen/wasm-opt release
      # from GitHub — a client-side WASM module for the browser's own
      # offline/OPFS storage, unrelated to anything tested here, and a real
      # point of CI flakiness. SKIP_WASM_BUILD=1 (the same variable
      # atomic-server's own downstream-saas CI job sets, for the same "the
      # embed only needs to exist" reason) skips it.
      #
      # The three VITE_* vars are build-time defaults baked into the embedded
      # frontend by its Vite build, which build.rs runs as a child process
      # that inherits this step's env (verified the next step down). Because
      # they are baked, the two URLs cannot be repointed at a different port
      # afterwards — which is exactly why every e2e lane has to reuse
      # lanes.json's `canonicalPorts` instead of its own derived block. That
      # is the constraint integrations/HANDOFF-runtime-urls.md removes;
      # when it lands, these two vars and the verification step below go.
      - name: Build atomic-server (e2e profile, unmodified pinned checkout)
        working-directory: atomic-server
        env:
          SKIP_WASM_BUILD: "1"
          VITE_PLUGIN_CATALOG_URL: http://localhost:${{ steps.ports.outputs.devServer }}/integrations/catalog.json
          VITE_E2E: "true"
          VITE_INTEGRATION_PROXY_URL: http://127.0.0.1:${{ steps.ports.outputs.mockProxy }}
        run: cargo build --profile e2e -p atomic-server --no-default-features --features wasm-plugins

      - name: Verify the built frontend uses this repo's catalog and proxy URLs
        working-directory: atomic-server
        run: |
          set -eu
          for needle in \
            "http://localhost:${{ steps.ports.outputs.devServer }}/integrations/catalog.json" \
            "http://127.0.0.1:${{ steps.ports.outputs.mockProxy }}"; do
            if ! grep -rl -- "$needle" browser/data-browser/dist >/dev/null; then
              echo "'$needle' was not baked into the built frontend" >&2
              exit 1
            fi
          done

      - name: Upload the server binary
        uses: actions/upload-artifact@v4
        with:
          name: atomic-server-binary
          path: atomic-server/target/e2e/atomic-server
          retention-days: 1

  # Not gated per lane: certify.mjs discovers and reports every certified
  # package in one pass regardless of what changed, and this layer is local
  # typecheck/bundle/fixture work with no server or browser involved — it is
  # not the cost the per-lane gating is aimed at. Splitting it would also
  # shard the certification report the artifact below publishes whole.
  shared-checks:
    name: Lint, tooling tests, certification
    needs: changes
    if: needs.changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout atomic-plugins
        uses: actions/checkout@v4
        with:
          path: atomic-plugins

      - name: Read pinned atomic-server commit
        id: pin
        run: echo "sha=$(cat atomic-plugins/.atomic-server-ref)" >> "$GITHUB_OUTPUT"

      - name: Checkout atomic-server at the pinned commit
        uses: actions/checkout@v4
        with:
          repository: ontola/atomic-server
          ref: ${{ steps.pin.outputs.sha }}
          path: atomic-server

      - name: Link atomic-server's browser workspace into atomic-plugins
        run: ln -s ../atomic-server/browser atomic-plugins/browser

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ steps.pin.outputs.sha }}-${{ hashFiles('atomic-server/browser/pnpm-lock.yaml') }}

      - name: Install JS dependencies
        working-directory: atomic-server/browser
        run: pnpm install --frozen-lockfile

      - name: Tooling unit tests
        working-directory: atomic-plugins
        run: |
          node --test \
            integrations/tooling/certify.test.mjs \
            integrations/tooling/dev-server.test.mjs \
            integrations/tooling/lanes.test.mjs \
            integrations/localthought/mock-proxy.test.mjs

      # plugin.js is a committed esbuild output (verified byte-for-byte against
      # a fresh bundle by the "reproducible-bundle" check below), not
      # hand-written source, so it is excluded here rather than made to
      # satisfy hand-written-code style rules like eqeqeq — esbuild's own
      # __toESM interop helper (pulled in by notion's plugin.js) uses `!=`.
      - name: Lint (oxlint)
        working-directory: atomic-plugins
        run: browser/node_modules/.bin/oxlint -c browser/.oxlintrc.json --ignore-pattern '**/plugin.js' integrations

      - name: Format check (oxfmt)
        working-directory: atomic-plugins
        run: browser/node_modules/.bin/oxfmt -c browser/.oxfmtrc.json --check integrations

      - name: Offline certification (typecheck, bundle reproducibility, fixture tests)
        working-directory: atomic-plugins
        run: node integrations/tooling/certify.mjs --layer js

      - name: Upload certification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-certification-report
          path: atomic-plugins/artifacts/integration-certification
          if-no-files-found: ignore

  lane:
    name: "Lane: ${{ matrix.lane }} (${{ matrix.tiers }})"
    needs: [changes, build-server]
    if: needs.changes.outputs.has-lanes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      # The point of the matrix: one red plugin must not hide the others.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - name: Checkout atomic-plugins
        uses: actions/checkout@v4
        with:
          path: atomic-plugins

      - name: Checkout atomic-server at the pinned commit
        uses: actions/checkout@v4
        with:
          repository: ontola/atomic-server
          ref: ${{ needs.build-server.outputs.sha }}
          path: atomic-server

      - name: Link atomic-server's browser workspace into atomic-plugins
        run: ln -s ../atomic-server/browser atomic-plugins/browser

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ needs.build-server.outputs.sha }}-${{ hashFiles('atomic-server/browser/pnpm-lock.yaml') }}

      - name: Install JS dependencies
        working-directory: atomic-server/browser
        run: pnpm install --frozen-lockfile

      - name: Download the server binary
        if: contains(matrix.tiers, 'live') || contains(matrix.tiers, 'e2e')
        uses: actions/download-artifact@v4
        with:
          name: atomic-server-binary
          path: atomic-server/target/e2e

      - name: Make the server binary executable
        if: contains(matrix.tiers, 'live') || contains(matrix.tiers, 'e2e')
        run: chmod +x atomic-server/target/e2e/atomic-server

      - name: Install Playwright (chromium)
        if: contains(matrix.tiers, 'e2e')
        working-directory: atomic-plugins
        run: browser/e2e/node_modules/.bin/playwright install --with-deps chromium

      # The same command a developer runs locally. run-lane.mjs starts
      # atomic-server, the mock proxy and the dev-server on this lane's ports
      # (lanes.json), runs the lane's tiers in cheapest-first order, and tears
      # them down. Every matrix job is its own runner, so the e2e tier's fixed
      # `canonicalPorts` cannot clash with another lane's.
      - name: Run the lane
        working-directory: atomic-plugins
        env:
          ATOMIC_SERVER_CHECKOUT: ${{ github.workspace }}/atomic-server
        run: node integrations/tooling/run-lane.mjs ${{ matrix.lane }}

      - name: Upload Playwright report
        if: always() && contains(matrix.tiers, 'e2e')
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.lane }}
          path: atomic-plugins/browser/e2e/playwright-report
          if-no-files-found: ignore

  # Proves the dev-server wiring actually works: every certified plugin.js and
  # the root catalog.json are byte-identical when fetched through it (this is
  # the "plugin hosting" a real browser's fetch() relies on at install time —
  # see server/build.rs::embed_integrations upstream), and an ordinary
  # atomic-data request still reaches the real atomic-server transparently
  # through the same URL. Not a plugin lane: it verifies shared infrastructure,
  # so it runs whenever anything under integrations/ changed.
  hosting-surface:
    name: Plugin catalog and hosting surface
    needs: [changes, build-server]
    if: needs.changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout atomic-plugins
        uses: actions/checkout@v4
        with:
          path: atomic-plugins

      - name: Checkout atomic-server at the pinned commit
        uses: actions/checkout@v4
        with:
          repository: ontola/atomic-server
          ref: ${{ needs.build-server.outputs.sha }}
          path: atomic-server

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download the server binary
        uses: actions/download-artifact@v4
        with:
          name: atomic-server-binary
          path: atomic-server/target/e2e

      - name: Start atomic-server, the mock proxy and the dev-server
        working-directory: atomic-plugins
        env:
          ATOMIC_SERVER_CHECKOUT: ${{ github.workspace }}/atomic-server
        run: |
          chmod +x "$ATOMIC_SERVER_CHECKOUT/target/e2e/atomic-server"
          node integrations/tooling/serve.mjs > serve.log 2>&1 &
          echo $! > serve.pid
          for i in $(seq 1 90); do
            grep -q 'ctrl-c to stop' serve.log && exit 0
            sleep 1
          done
          echo "the stack did not become ready in time" >&2
          cat serve.log
          exit 1

      - name: Verify the catalog and hosting surface
        working-directory: atomic-plugins
        run: |
          set -eu
          ports=$(node -e '
            const p = require("./integrations/lanes.json").canonicalPorts;
            console.log(p.devServer, p.atomicServer);
          ')
          dev=$(echo "$ports" | cut -d' ' -f1)
          upstream=$(echo "$ports" | cut -d' ' -f2)
          check() {
            local path="$1" expected actual
            expected=$(sha256sum "$path" | cut -d' ' -f1)
            actual=$(curl -sf "http://localhost:$dev/integrations/${path#integrations/}" | sha256sum | cut -d' ' -f1)
            if [ "$expected" != "$actual" ]; then
              echo "mismatch serving $path through the dev-server proxy" >&2
              exit 1
            fi
          }
          check integrations/catalog.json
          for plugin in integrations/*/plugin.js; do
            check "$plugin"
          done
          curl -sf -o /dev/null "http://localhost:$dev/integrations/issue-tracker/README.md" && \
            { echo "dev-server must not host non-catalog integration files" >&2; exit 1; }
          direct=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:$upstream/")
          proxied=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:$dev/")
          if [ "$direct" != "$proxied" ]; then
            echo "dev-server did not transparently proxy a non-integrations request (direct=$direct proxied=$proxied)" >&2
            exit 1
          fi

      - name: Stop the stack
        if: always()
        working-directory: atomic-plugins
        run: |
          [ -f serve.pid ] && kill "$(cat serve.pid)" 2>/dev/null || true
          cat serve.log || true

  # plugin.spec.ts drives atomic-server's generic uploaded-plugin system
  # (bootstrap sandbox, custom views) and is not tied to any one integration
  # package, so it is not a lane: it runs whenever any integration or shared
  # code changed. It lives upstream in atomic-server and runs with atomic-server's
  # own Playwright config; the two integration-specific tests that used to sit
  # beside it in plugins.spec.ts are now lanes (integrations/pets/e2e/ and
  # integrations/notion/e2e/).
  e2e-plugin-system:
    name: "E2E: plugin sandbox and bootstrap"
    needs: [changes, build-server]
    if: needs.changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout atomic-plugins
        uses: actions/checkout@v4
        with:
          path: atomic-plugins

      - name: Checkout atomic-server at the pinned commit
        uses: actions/checkout@v4
        with:
          repository: ontola/atomic-server
          ref: ${{ needs.build-server.outputs.sha }}
          path: atomic-server

      - name: Link atomic-server's browser workspace into atomic-plugins
        run: ln -s ../atomic-server/browser atomic-plugins/browser

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ needs.build-server.outputs.sha }}-${{ hashFiles('atomic-server/browser/pnpm-lock.yaml') }}

      - name: Install JS dependencies
        working-directory: atomic-server/browser
        run: pnpm install --frozen-lockfile

      - name: Download the server binary
        uses: actions/download-artifact@v4
        with:
          name: atomic-server-binary
          path: atomic-server/target/e2e

      - name: Install Playwright (chromium)
        working-directory: atomic-plugins
        run: browser/e2e/node_modules/.bin/playwright install --with-deps chromium

      - name: Start atomic-server, the mock proxy and the dev-server
        working-directory: atomic-plugins
        env:
          ATOMIC_SERVER_CHECKOUT: ${{ github.workspace }}/atomic-server
        run: |
          chmod +x "$ATOMIC_SERVER_CHECKOUT/target/e2e/atomic-server"
          node integrations/tooling/serve.mjs > serve.log 2>&1 &
          echo $! > serve.pid
          for i in $(seq 1 90); do
            grep -q 'ctrl-c to stop' serve.log && exit 0
            sleep 1
          done
          echo "the stack did not become ready in time" >&2
          cat serve.log
          exit 1

      - name: Run plugin.spec.ts
        working-directory: atomic-plugins
        run: |
          set -eu
          dev=$(node -e 'console.log(require("./integrations/lanes.json").canonicalPorts.devServer)')
          SERVER_URL="http://localhost:$dev" FRONTEND_URL="http://localhost:$dev" \
            browser/e2e/node_modules/.bin/playwright test \
              --config=browser/e2e/playwright.config.ts --project=chromium \
              browser/e2e/tests/plugin.spec.ts

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-plugin-system
          path: atomic-plugins/browser/e2e/playwright-report
          if-no-files-found: ignore

      - name: Stop the stack
        if: always()
        working-directory: atomic-plugins
        run: |
          [ -f serve.pid ] && kill "$(cat serve.pid)" 2>/dev/null || true
          cat serve.log || true

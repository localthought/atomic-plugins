overlay: 1.0.0
info:
  title: Google Calendar API CRUD Causality
  version: 1.1.0
# Declares the CRUD-causality resources this platform needs: which
# collections exist, how each item is addressed, and (since the base
# document is otherwise read-only — see its description) the one write path
# auth-overlay.yaml adds: a partial update to an event. Mirrors the shape of
# the GitHub crud-causality overlay in this repo, with one Google-specific
# point: there is no "list all calendars" operation, so `event`'s
# `calendarId` context comes from enumerating `calendarListEntry` (via its
# own identity binding) rather than from a dedicated calendars collection.
actions:
  - target: $.components
    update:
      crudResources:
        calendarListEntry:
          schema:
            $ref: '#/components/schemas/calendar-list-entry'
          description: >
            An entry on the authenticated user's calendar list. Its `id` is
            also what the `event` resource's collections address a calendar
            by, so this is where the `calendarId` context comes from.
          identity:
            urlTemplate: /users/me/calendarList/{calendarId}
            bindings:
              calendarId:
                field: id
          collections:
            calendarList:
              urlTemplate: /users/me/calendarList
        event:
          schema:
            $ref: '#/components/schemas/event'
          description: >
            An event on a calendar. `calendarId` is supplied by enumerating
            `calendarList` (see above), not by this resource's own identity.
          identity:
            urlTemplate: /calendars/{calendarId}/events/{eventId}
            bindings:
              eventId:
                field: id
          collections:
            events:
              urlTemplate: /calendars/{calendarId}/events

  - target: $.paths['/users/me/calendarList'].get
    update:
      x-crud:
        action: list
        resource: calendarListEntry
        collection: calendarList
  - target: $.paths['/users/me/calendarList/{calendarId}'].get
    update:
      x-crud:
        action: read
        resource: calendarListEntry

  - target: $.paths['/calendars/{calendarId}/events'].get
    update:
      x-crud:
        action: list
        resource: event
        collection: events
  - target: $.paths['/calendars/{calendarId}/events/{eventId}'].get
    update:
      x-crud:
        action: read
        resource: event
  - target: $.paths['/calendars/{calendarId}/events/{eventId}'].patch
    update:
      x-crud:
        action: update
        resource: event

overlay: 1.0.0
info:
  title: Google Calendar event schema completeness
  version: 1.0.0
actions:
  - target: $.components.schemas.event.properties
    update:
      recurrence:
        type: array
        description: RRULE, EXRULE, RDATE, and EXDATE lines for a recurring event.
        items:
          type: string
      originalStartTime:
        type: object
        description: Original start time of a recurring event instance.
        properties:
          date:
            type: string
            format: date
          dateTime:
            type: string
            format: date-time
          timeZone:
            type: string
      etag:
        type: string
        description: >
          Opaque version identifier, present on every read. Send back as
          `If-Match` on a PATCH for optimistic-concurrency conflict
          detection.

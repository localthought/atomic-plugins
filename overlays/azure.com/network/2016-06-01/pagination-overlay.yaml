overlay: 1.0.0
info:
  title: Azure Network API Pagination Schemes
  version: 1.0.0
actions:
  - target: $.components
    update:
      paginationSchemes:
        nextLink:
          type: nextLink
          description: >-
            Azure Network list operations use nextLink-style pagination
            (x-ms-pageable). Responses include a `nextLink` field with the
            full URL for the next page of results when more data is available.
          autoDetect:
            matchQueryParams: false
            matchBodyFields: false
            matchResponseFields: true
            requireAll: false
          response:
            bodyFields:
              nextLink:
                role: nextLink

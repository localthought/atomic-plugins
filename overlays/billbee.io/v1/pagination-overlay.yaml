overlay: 1.0.0
info:
  title: Billbee API Pagination Schemes
  version: 1.0.0
actions:
  - target: $.components
    update:
      paginationSchemes:
        pageNumber:
          type: pageNumber
          description: >-
            Billbee uses 1-based page-number pagination. `page` selects the
            page (starting from 1) and `pageSize` controls the number of
            results returned (range 1-250, default 50).
          request:
            queryParameters:
              page:
                role: page
              pageSize:
                role: pageSize

overlay: 1.0.0
info:
  title: BBC My Account & Metadata API Pagination Schemes
  version: 1.0.0
actions:
- target: "$.components"
  update:
    paginationSchemes:
      offset:
        type: pageNumber
        description: >-
          Zero-based offset/limit pagination. The response echoes `limit`
          and `offset` and reports the total match count as `total`.
        request:
          queryParameters:
            limit:
              role: pageSize
            offset:
              role: offset
        response:
          bodyFields:
            limit:
              role: pageSize
            offset:
              role: offset
            total:
              role: totalCount
      offsetRequestOnly:
        type: pageNumber
        description: >-
          Same request parameters as `offset`, but these endpoints return
          a job-status object rather than a paginated results envelope.
        request:
          queryParameters:
            limit:
              role: pageSize
            offset:
              role: offset
- target: "$.paths['/broadcasts'].get"
  update:
    x-pagination:
    - scheme: offset
- target: "$.paths['/broadcasts/latest'].get"

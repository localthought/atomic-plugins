overlay: 1.0.0
info:
  title: AWS Athena API Pagination Schemes
  version: 1.0.0
actions:
  - target: $.components
    update:
      paginationSchemes:
        nextToken:
          type: pageToken
          description: >-
            Athena list operations (e.g. ListQueryExecutions, ListNamedQueries,
            ListDataCatalogs) use NextToken-based pagination. `MaxResults`
            limits the results per request and `NextToken` (from the previous
            response) continues pagination.
          request:
            queryParameters:
              MaxResults:
                role: pageSize
              NextToken:
                role: pageToken
          response:
            bodyFields:
              NextToken:
                role: nextPageToken

overlay: 1.0.0
info:
  title: AWS SNS API Pagination Schemes
  version: 1.0.0
actions:
  - target: $.components
    update:
      paginationSchemes:
        nextToken:
          type: pageToken
          description: >-
            SNS list operations (e.g. ListTopics, ListSubscriptions,
            ListEndpointsByPlatformApplication) use NextToken-based pagination.
            Pass the `NextToken` from the previous response to retrieve the
            next page of results.
          request:
            queryParameters:
              NextToken:
                role: pageToken
          response:
            bodyFields:
              NextToken:
                role: nextPageToken

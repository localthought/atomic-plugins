overlay: 1.0.0
info:
  title: CamBase API Pagination Schemes
  version: 1.0.0
actions:
- target: "$.components"
  update:
    paginationSchemes:
      pageNumber:
        type: pageNumber
        request:
          queryParameters:
            page:
              role: page
- target: "$.paths['/api/v1/models.json'].get"
  update:
    x-pagination:
    - scheme: pageNumber
- target: "$.paths['/api/v1/models/search.json'].get"
  update:
    x-pagination:
    - scheme: pageNumber
- target: "$.paths['/api/v1/recorders.json'].get"
  update:
    x-pagination:
    - scheme: pageNumber
- target: "$.paths['/api/v1/recorders/search.json'].get"
  update:
    x-pagination:
    - scheme: pageNumber
- target: "$.paths['/api/v1/vendors.json'].get"
  update:
    x-pagination:
    - scheme: pageNumber

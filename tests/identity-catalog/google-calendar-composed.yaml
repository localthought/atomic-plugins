openapi: 3.0.3
info:
  title: Google Calendar (Reflector subset)
  version: v3
  description: 'A narrowed, read-only subset of the Google Calendar API (googleapis.com
    calendar v3) covering what Reflector needs to reflect a user''s calendars and
    their events: list/read of calendar list entries, and list/read of events on a
    calendar. The full document is published by Google and mirrored on apis.guru;
    only the paths and schemas used here are vendored. The completing overlays (auth
    / pagination / crud-causality) are applied from spec/google-calendar/overlays
    at startup. Unlike GitHub, this platform is read-only: Reflector never creates,
    updates or deletes calendar data.

    '
servers:
- url: https://www.googleapis.com/calendar/v3
components:
  securitySchemes:
    googleToken:
      type: http
      scheme: bearer
      description: "An OAuth 2.0 access token for a scope covering calendar read access\
        \ (e.g. https://www.googleapis.com/auth/calendar.readonly), sent as `Authorization:\
        \ Bearer <token>`. Reflector does not run the OAuth flow itself \u2014 the\
        \ token is supplied as deployment configuration, already obtained (and, if\
        \ it expires, refreshed) out of band.\n"
    googleOnline:
      type: oauth2
      x-oauth-authentication-details:
        authorizationServerMetadata:
          token_endpoint_auth_methods_supported:
          - client_secret_post
          - client_secret_basic
          code_challenge_methods_supported:
          - S256
        authorizationCode:
          pkce:
            requirement: optional
          profile:
            parameters:
            - parameter:
                name: access_type
                in: query
                schema:
                  type: string
                  enum:
                  - online
                  - offline
              value: online
            tokenIssuance:
              refreshToken:
                presence: never
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.google.com/o/oauth2/v2/auth
          tokenUrl: https://oauth2.googleapis.com/token
          scopes:
            https://www.googleapis.com/auth/calendar.events: View and edit events
              on calendars.
            https://www.googleapis.com/auth/calendar.calendarlist.readonly: View the
              calendars to which the user is subscribed.
            openid: Identify the authenticated Google Account.
            email: Read the authenticated user's email claim.
            profile: Read the authenticated user's profile claims.
    googleOffline:
      type: oauth2
      x-oauth-authentication-details:
        authorizationServerMetadata:
          token_endpoint_auth_methods_supported:
          - client_secret_post
          - client_secret_basic
          code_challenge_methods_supported:
          - S256
        authorizationCode:
          pkce:
            requirement: optional
          profile:
            parameters:
            - parameter:
                name: access_type
                in: query
                schema:
                  type: string
                  enum:
                  - online
                  - offline
              value: offline
            capabilities:
            - offlineAccess
            tokenIssuance:
              refreshToken:
                presence: conditional
                conditions:
                - firstAuthorization
                description: Google can omit a refresh token after the first authorization.
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.google.com/o/oauth2/v2/auth
          tokenUrl: https://oauth2.googleapis.com/token
          scopes:
            https://www.googleapis.com/auth/calendar.events: View and edit events
              on calendars.
            https://www.googleapis.com/auth/calendar.calendarlist.readonly: View the
              calendars to which the user is subscribed.
            openid: Identify the authenticated Google Account.
            email: Read the authenticated user's email claim.
            profile: Read the authenticated user's profile claims.
  schemas:
    calendar-list-entry:
      type: object
      description: "An entry on the authenticated user's calendar list \u2014 how\
        \ Reflector discovers which calendars exist, since Google Calendar has no\
        \ \"list all calendars\" operation.\n"
      properties:
        id:
          type: string
          description: Calendar identifier, usable as `calendarId` elsewhere.
        summary:
          type: string
          description: Title of the calendar.
        description:
          type: string
        timeZone:
          type: string
          description: IANA time zone, e.g. "Europe/Zurich".
        primary:
          type: boolean
          description: Whether this is the authenticated user's primary calendar.
        accessRole:
          type: string
          enum:
          - freeBusyReader
          - reader
          - writer
          - owner
        backgroundColor:
          type: string
    event-date-time:
      type: object
      description: 'Either a date (all-day event) or a date-time-with-time-zone, per
        Google''s convention of splitting the two into distinct fields.

        '
      properties:
        date:
          type: string
          format: date
        dateTime:
          type: string
          format: date-time
        timeZone:
          type: string
    event-attendee:
      type: object
      properties:
        email:
          type: string
        displayName:
          type: string
        organizer:
          type: boolean
        responseStatus:
          type: string
          enum:
          - needsAction
          - declined
          - tentative
          - accepted
    event-person:
      type: object
      description: The organizer or creator of an event.
      properties:
        email:
          type: string
        displayName:
          type: string
        self:
          type: boolean
    event:
      type: object
      description: An event on a calendar.
      properties:
        id:
          type: string
          description: Opaque event identifier, unique within its calendar.
        status:
          type: string
          enum:
          - confirmed
          - tentative
          - cancelled
        htmlLink:
          type: string
          format: uri
        summary:
          type: string
        description:
          type: string
        location:
          type: string
        created:
          type: string
          format: date-time
        updated:
          type: string
          format: date-time
        start:
          $ref: '#/components/schemas/event-date-time'
        end:
          $ref: '#/components/schemas/event-date-time'
        recurringEventId:
          type: string
          description: Set on an instance of a recurring event, naming the series.
        organizer:
          $ref: '#/components/schemas/event-person'
        creator:
          $ref: '#/components/schemas/event-person'
        attendees:
          type: array
          items:
            $ref: '#/components/schemas/event-attendee'
        recurrence:
          type: array
          description: RRULE, EXRULE, RDATE, and EXDATE lines for a recurring event.
          items:
            type: string
        originalStartTime:
          type: object
          description: Original start time of a recurring event instance.
          properties:
            date:
              type: string
              format: date
            dateTime:
              type: string
              format: date-time
            timeZone:
              type: string
        etag:
          type: string
          description: 'Opaque version identifier, present on every read. Send back
            as `If-Match` on a PATCH for optimistic-concurrency conflict detection.

            '
  paginationSchemes:
    pageToken:
      type: pageToken
      request:
        queryParameters:
          maxResults:
            role: pageSize
            description: Results per page.
          pageToken:
            role: pageToken
            description: Token specifying which result page to return.
      response:
        bodyFields:
          nextPageToken:
            role: nextPageToken
            description: 'Token for the next page of results; omitted on the last
              page.

              '
  crudResources:
    calendarListEntry:
      schema:
        $ref: '#/components/schemas/calendar-list-entry'
      description: 'An entry on the authenticated user''s calendar list. Its `id`
        is also what the `event` resource''s collections address a calendar by, so
        this is where the `calendarId` context comes from.

        '
      identity:
        urlTemplate: /users/me/calendarList/{calendarId}
        bindings:
          calendarId:
            field: id
      collections:
        calendarList:
          urlTemplate: /users/me/calendarList
    event:
      schema:
        $ref: '#/components/schemas/event'
      description: 'An event on a calendar. `calendarId` is supplied by enumerating
        `calendarList` (see above), not by this resource''s own identity.

        '
      identity:
        urlTemplate: /calendars/{calendarId}/events/{eventId}
        bindings:
          eventId:
            field: id
      collections:
        events:
          urlTemplate: /calendars/{calendarId}/events
paths:
  /users/me/calendarList:
    get:
      operationId: calendarList-list
      summary: List the authenticated user's calendars
      parameters:
      - name: maxResults
        in: query
        required: false
        schema:
          type: integer
          default: 100
      - name: pageToken
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: A page of calendar list entries.
          content:
            application/json:
              schema:
                type: object
                properties:
                  nextPageToken:
                    type: string
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/calendar-list-entry'
      security:
      - googleOnline:
        - https://www.googleapis.com/auth/calendar.calendarlist.readonly
      - googleOffline:
        - https://www.googleapis.com/auth/calendar.calendarlist.readonly
      x-pagination:
      - scheme: pageToken
      x-crud:
        action: list
        resource: calendarListEntry
        collection: calendarList
  /users/me/calendarList/{calendarId}:
    get:
      operationId: calendarList-get
      summary: Get one calendar list entry
      parameters:
      - name: calendarId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The calendar list entry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/calendar-list-entry'
      security:
      - googleOnline:
        - https://www.googleapis.com/auth/calendar.calendarlist.readonly
      - googleOffline:
        - https://www.googleapis.com/auth/calendar.calendarlist.readonly
      x-crud:
        action: read
        resource: calendarListEntry
  /calendars/{calendarId}/events:
    get:
      operationId: events-list
      summary: List events on a calendar
      parameters:
      - name: calendarId
        in: path
        required: true
        schema:
          type: string
      - name: maxResults
        in: query
        required: false
        schema:
          type: integer
          default: 250
      - name: pageToken
        in: query
        required: false
        schema:
          type: string
      - name: singleEvents
        in: query
        required: false
        description: 'Expand recurring events into their individual instances rather
          than returning the recurring series itself.

          '
        schema:
          type: boolean
          default: true
      - name: orderBy
        in: query
        required: false
        schema:
          type: string
          enum:
          - startTime
          - updated
      - name: timeMin
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: timeMax
        in: query
        required: false
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: A page of events.
          content:
            application/json:
              schema:
                type: object
                properties:
                  nextPageToken:
                    type: string
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/event'
      security:
      - googleOnline:
        - https://www.googleapis.com/auth/calendar.events
      - googleOffline:
        - https://www.googleapis.com/auth/calendar.events
      x-pagination:
      - scheme: pageToken
      x-crud:
        action: list
        resource: event
        collection: events
  /calendars/{calendarId}/events/{eventId}:
    get:
      operationId: events-get
      summary: Get a single event
      parameters:
      - name: calendarId
        in: path
        required: true
        schema:
          type: string
      - name: eventId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The event.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/event'
      security:
      - googleOnline:
        - https://www.googleapis.com/auth/calendar.events
      - googleOffline:
        - https://www.googleapis.com/auth/calendar.events
      x-crud:
        action: read
        resource: event
    patch:
      operationId: events-patch
      summary: Update fields on an existing event
      description: 'A partial update to an event. `If-Match` carries the event''s
        last-known ETag for optimistic-concurrency conflict detection; Google returns
        412 if the event changed remotely since it was read.

        '
      parameters:
      - name: calendarId
        in: path
        required: true
        schema:
          type: string
      - name: eventId
        in: path
        required: true
        schema:
          type: string
      - name: sendUpdates
        in: query
        required: false
        description: Whether to notify attendees of the change.
        schema:
          type: string
          enum:
          - all
          - externalOnly
          - none
      - name: If-Match
        in: header
        required: false
        description: The event's last-known ETag.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/event'
      responses:
        '200':
          description: The updated event.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/event'
        '412':
          description: The If-Match precondition failed.
      security:
      - googleOnline:
        - https://www.googleapis.com/auth/calendar.events
      - googleOffline:
        - https://www.googleapis.com/auth/calendar.events
      x-crud:
        action: update
        resource: event
  /v1/userinfo:
    get:
      operationId: getGoogleAuthenticatedPrincipal
      summary: Get the authenticated Google principal
      servers:
      - url: https://openidconnect.googleapis.com
      security:
      - googleOnline:
        - openid
        - email
        - profile
      - googleOffline:
        - openid
        - email
        - profile
      x-authenticated-principal:
        kind: user
        namespace: https://accounts.google.com
        subject: $response.body#/sub
        identifier:
          scope: provider
          stable: true
          reassigned: false
        claims:
          name: $response.body#/name
          email: $response.body#/email
          picture: $response.body#/picture
          email_verified: $response.body#/email_verified
      responses:
        '200':
          description: The authenticated OpenID Connect user.
          content:
            application/json:
              schema:
                type: object
                required:
                - sub
                properties:
                  sub:
                    type: string
                  name:
                    type: string
                  email:
                    type: string
                  picture:
                    type: string
                    format: uri
                  email_verified:
                    type: boolean
